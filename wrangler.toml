# ============================================================
# Ukraine Defender — Wrangler config
# FULL FILE
# ============================================================

name = "ukraine-defender-api"

main = "worker.js"

compatibility_date = "2026-07-01"

workers_dev = true

# Если позже захочешь повесить API на свой домен,
# раскомментируй и подставь домен.
#
# routes = [
#   { pattern = "api.your-domain.com/*", zone_name = "your-domain.com" }
# ]

# ============================================================
# OBSERVABILITY
# ============================================================

[observability]
enabled = true

# ============================================================
# VARS
# ============================================================

[vars]
# Origin фронтенда.
# Нужен, чтобы API нормально отвечал фронту на Pages.
PUBLIC_ORIGIN = "https://ukraine-defender.pages.dev"

# Если этот Worker является единственным API — оставляем пусто.
# Если у тебя отдельно живёт старый data-worker,
# тогда сюда надо вставить URL старого data-worker.
DATA_API_URL = ""

# Только для разработки.
# В production лучше выключить.
AUTH_DEBUG = "0"

# ============================================================
# D1 DATABASE
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "ukraine-defender-db"
database_id = "3e976fde-c21a-4f27-bcd0-bff2ce2bb89f"
